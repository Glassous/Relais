services:
  workspace-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workspace-backend
    ports:
      - "8184:8184"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8184
      - MONGO_URI=mongodb://mongodb:27017/workspace
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: workspace-mongodb
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
    driver: local
