name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-backend:
    name: 编译并部署后端
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 根据实际项目 Go 版本调整

      - name: 编译 Go 后端二进制
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o relais-backend .

      - name: 创建远程项目目录
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ secrets.PROJECT_PATH }}

      - name: 传输后端文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,backend/Dockerfile,backend/relais-backend,backend/.env.example"
          target: ${{ secrets.PROJECT_PATH }}

      - name: SSH 部署与重启 Docker 容器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            if [ ! -f backend/.env ]; then
              if [ -f backend/.env.example ]; then
                cp backend/.env.example backend/.env
                echo "已根据 .env.example 生成 backend/.env，请记得按需修改配置"
              else
                touch backend/.env
              fi
            fi
            docker compose down || true
            docker compose up -d --build

  deploy-frontend:
    name: 编译并部署前端
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境 (Flutter 构建依赖)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 编译 Flutter Web 前端
        run: |
          cd relais
          flutter pub get
          flutter build web --release

      - name: 清理并创建远程前端目录
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ secrets.FRONTEND_PATH }}
            rm -rf ${{ secrets.FRONTEND_PATH }}/*

      - name: 传输前端静态文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "relais/build/web/*"
          target: ${{ secrets.FRONTEND_PATH }}
          strip_components: 3
